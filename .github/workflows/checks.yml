name: Release checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
        language: [heuristic, nltk]
    env:
      AETHEL_NLTK_DATA: ${{ runner.temp }}/aethel-nltk-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.language == 'nltk'
        run: |
          python -m pip install '.[nlp]'
          python -m aethel_pkg.language_resources --download
      - run: PYTHONHASHSEED=0 python -m unittest discover -s tests -q
      - run: python -m pip install '.[web,fast,dev]'
      - run: ruff check --select F setup.py aethel_live.py aethel_pkg town_pkg aethel_web tests scripts && ruff format --check setup.py aethel_live.py aethel_pkg town_pkg aethel_web tests scripts
      - run: PYTHONHASHSEED=0 python -m unittest discover -s tests -p test_web.py -q
      - run: PYTHONHASHSEED=0 python -m unittest discover -s tests -p test_shutdown.py -q
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [heuristic, nltk]
        transport: [polling, picows, websockets]
        include:
          - transport: polling
            http: stdlib
            ws: none
          - transport: picows
            http: uvicorn
            ws: picows
          - transport: websockets
            http: uvicorn
            ws: websockets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise npm 10 lockfile compatibility
        if: matrix.transport == 'polling'
        run: npm install --global npm@10.9.4
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run lint && npm run format:check && npm test && npm run build
        working-directory: web
      - run: python -m pip install '.[web,fast]'
      - if: matrix.language == 'nltk'
        run: |
          python -m pip install '.[nlp]'
          python -m aethel_pkg.language_resources --download
        env:
          AETHEL_NLTK_DATA: ${{ runner.temp }}/aethel-nltk-data
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          AETHEL_E2E_HTTP: ${{ matrix.http }}
          AETHEL_E2E_WS: ${{ matrix.ws }}
          AETHEL_E2E_LANGUAGE: ${{ matrix.language }}
          AETHEL_NLTK_DATA: ${{ runner.temp }}/aethel-nltk-data
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.language }}-${{ matrix.transport }}
          path: web/test-results/
