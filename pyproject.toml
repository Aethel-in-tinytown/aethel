[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aethel-town"
version = "0.29.0"
description = "A deterministic digital organism and its live pixel town"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
nlp = ["nltk==3.9.2"]
web = ["uvicorn>=0.30,<1", "websockets>=14,<18"]
fast = ["picows>=2.3.1,<3"]
experimental-http = ["fasthttppy==0.0.2"]
dev = ["ruff>=0.14,<1"]

[project.scripts]
aethel = "aethel_pkg.main:main"

[tool.setuptools.packages.find]
include = ["aethel_pkg*", "town_pkg*", "aethel_web*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.setuptools.package-data]
aethel_pkg = ["nlp_data/*.json", "nlp_data/licenses/*"]
aethel_web = ["static/*", "static/assets/*", "static/chunks/*"]
